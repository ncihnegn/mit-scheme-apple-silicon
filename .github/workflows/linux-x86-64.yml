name: Linux x86-64 & SVM1 CI

on:
  push:
    branches:
      - master
      - apple-silicon
      - zig
  pull_request:
    branches:
      - master
      - apple-silicon
      - zig
  workflow_dispatch:
    inputs:
      force_full_bootstrap:
        description: Force clean full bootstrap (skip Stage 2 cache)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: linux-x86-64-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-x86-64-native:
    name: Linux x86-64 (Native + FFI Plugins)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Install APT build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev libgdbm-dev libpq-dev libx11-dev pkg-config curl ca-certificates python3

      - name: Build variants and run unit & smoke tests
        run: |
          zig build -Darch=x86_64 -Ddebugging=true
          zig build -Darch=x86_64 -Dtermcap=emulate
          zig build test-unit -Darch=x86_64 --summary all
          zig build test-smoke -Darch=x86_64 --summary all

      - name: Prepare Stage 2 native x86-64 host (cached)
        uses: ./.github/actions/stage2-bootstrap
        with:
          cache_prefix: linux-x86-64-stage2
          stage2_prefix: ${{ runner.temp }}/mit-scheme-stage2-x86-64
          mode: build-scheme-svm1-12-1
          arch: x86-64
          force_full_bootstrap: ${{ inputs.force_full_bootstrap }}

      - name: Build Stage 3 self-hosted native x86-64 and FFI plugins
        run: |
          python3 tools/build-scheme.py clean
          python3 tools/build-scheme.py build \
            --arch x86-64 \
            --optimize ReleaseFast \
            --host-scheme "${{ runner.temp }}/mit-scheme-stage2-x86-64/bin/mit-scheme" \
            --plugins edwin,imail,blowfish,gdbm,pgsql,x11 \
            --jobs "$(nproc)"

      - name: Verify W^X virtual memory mappings and SIGSEGV trap recovery
        run: |
          ./tests/ci/verify-wx-mappings.sh --scheme zig-out/bin/mit-scheme --library src/lib
          VERIFY_TMP=$(mktemp -d)
          trap 'rm -rf "${VERIFY_TMP}"' EXIT
          SCM_CI_TMPDIR="${VERIFY_TMP}" ./zig-out/bin/mit-scheme \
            --library src/lib \
            --band all.com \
            --emacs \
            --batch-mode \
            --no-init-file \
            --load tests/ci/verify-trap.scm \
            --eval '(%exit)' \
            </dev/null 2>&1 | tee "${VERIFY_TMP}/verify-trap.log"
          grep -q 'FORGE_TRAP_RECOVERY_OK' "${VERIFY_TMP}/verify-trap.log"

      - name: Run Scheme test suite and FFI plugin checks
        run: |
          python3 tests/ci/check-results.py \
            --src-dir src \
            --scheme-exe zig-out/bin/mit-scheme \
            --library-path src/lib
          (cd src/blowfish && MIT_SCHEME_EXE="${PWD}/../../zig-out/bin/mit-scheme" MITSCHEME_LIBRARY_PATH="${PWD}/../lib" sh ./blowfish-check.sh)
          (cd src/gdbm && MIT_SCHEME_EXE="${PWD}/../../zig-out/bin/mit-scheme" MITSCHEME_LIBRARY_PATH="${PWD}/../lib" sh ./gdbm-check.sh)
          (cd src/pgsql && ../../zig-out/bin/mit-scheme \
            --library ../lib \
            --prepend-library . \
            --band all.com \
            --batch-mode \
            --no-init-file \
            --eval "(begin (load-option 'pgsql) (let ((s ((access escape-pgsql-string (->environment '(postgresql))) \"a'b\"))) (if (not (string=? s \"a''b\")) (error \"pgsql failed:\" s))) (display \"PGSQL_FFI_OK\n\") (%exit))" \
            </dev/null)
          (cd src/x11 && ../../zig-out/bin/mit-scheme \
            --library ../lib \
            --prepend-library . \
            --band all.com \
            --batch-mode \
            --no-init-file \
            --eval "(begin (load-option 'x11) (display \"X11_FFI_OK\n\") (%exit))" \
            </dev/null)

  linux-x86-64-svm1:
    name: Linux x86-64 (SVM1 Bytecode VM)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Install APT build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev curl ca-certificates python3

      - name: Build SVM1 microcode variants and run unit & smoke tests
        run: |
          zig build -Darch=svm1_64le --release=fast
          zig build -Darch=svm1_64le -Dtermcap=emulate
          zig build test-unit -Darch=svm1_64le --summary all
          zig build test-smoke -Darch=svm1_64le --summary all

      - name: Prepare Stage 2 SVM1 host (cached)
        uses: ./.github/actions/stage2-bootstrap
        with:
          cache_prefix: linux-x86-64-svm1-stage2
          stage2_prefix: ${{ runner.temp }}/mit-scheme-stage2-svm1
          mode: build-scheme-svm1-12-1
          arch: svm1-64le
          force_full_bootstrap: ${{ inputs.force_full_bootstrap }}

      - name: Build Stage 3 self-hosted SVM1 and run Scheme test suite
        run: |
          python3 tools/build-scheme.py clean
          python3 tools/build-scheme.py build \
            --arch svm1-64le \
            --optimize ReleaseFast \
            --host-scheme "${{ runner.temp }}/mit-scheme-stage2-svm1/bin/mit-scheme" \
            --plugins edwin,imail \
            --jobs "$(nproc)"
          python3 tests/ci/check-results.py \
            --src-dir src \
            --scheme-exe zig-out/bin/mit-scheme \
            --library-path src/lib
