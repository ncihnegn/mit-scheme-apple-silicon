name: Linux x86-64 & SVM1 CI

on:
  push:
    branches:
      - master
      - apple-silicon
      - zig
  pull_request:
    branches:
      - master
      - apple-silicon
      - zig
  workflow_dispatch:
    inputs:
      force_full_bootstrap:
        description: Force clean full bootstrap (skip Stage 2 cache)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: linux-x86-64-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-x86-64-native:
    name: Linux x86-64 (Native + FFI Plugins)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install APT build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential mit-scheme libncurses-dev libgdbm-dev libpq-dev libx11-dev pkg-config python3

      - name: Check Zig formatting, build variants, unit & smoke tests
        run: |
          zig fmt --check build.zig src/microcode src/blowfish src/gdbm src/x11 tests/microcode tests/plugins
          zig build -Darch=x86_64 -Ddebugging=true
          zig build -Darch=x86_64 -Dtermcap=emulate
          zig build test-unit -Darch=x86_64 --summary all
          zig build test-smoke -Darch=x86_64 --summary all

      - name: Restore Stage 2 native x86-64 host cache
        id: stage2-cache
        if: ${{ inputs.force_full_bootstrap != true }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/mit-scheme-stage2-x86-64
          key: >-
            linux-x86-64-stage2-${{
              hashFiles(
                'build.zig',
                'tools/build-scheme.py',
                'src/microcode/*.zig',
                'src/microcode/**/*.zig',
                'src/microcode/outf.c',
                'src/microcode/scm_setjmp.c',
                'src/microcode/cmpauxmd/x86-64.S',
                'src/compiler/**',
                'src/runtime/**',
                'src/sf/**',
                'src/cref/**',
                'src/sos/**'
              )
            }}

      - name: Build Stage 2 native x86-64 host
        if: ${{ steps.stage2-cache.outputs.cache-hit != 'true' }}
        run: |
          ALL_COM=$(find /usr/lib /usr/local/lib -name all.com -path '*mit-scheme*' 2>/dev/null | head -n 1)
          if [ -z "${ALL_COM}" ]; then
            echo "error: could not find host mit-scheme all.com" >&2
            exit 1
          fi
          HOST_LIB=$(dirname "${ALL_COM}")
          STAGE2_PREFIX="${{ runner.temp }}/mit-scheme-stage2-x86-64"
          python3 tools/build-scheme.py clean
          python3 tools/build-scheme.py build \
            --install \
            --arch x86-64 \
            --optimize ReleaseFast \
            --cross \
            --host-scheme "$(command -v mit-scheme)" \
            --host-lib "${HOST_LIB}" \
            --prefix "${STAGE2_PREFIX}" \
            --jobs "$(nproc)"
          "${STAGE2_PREFIX}/bin/mit-scheme" --batch-mode --no-init-file --eval '(%exit)' </dev/null >/dev/null
          python3 tools/build-scheme.py clean

      - name: Save Stage 2 native x86-64 host cache
        if: ${{ inputs.force_full_bootstrap != true && steps.stage2-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/mit-scheme-stage2-x86-64
          key: ${{ steps.stage2-cache.outputs.cache-primary-key }}

      - name: Build Stage 3 self-hosted native x86-64 and FFI plugins
        run: |
          python3 tools/build-scheme.py clean
          python3 tools/build-scheme.py build \
            --arch x86-64 \
            --optimize ReleaseFast \
            --host-scheme "${{ runner.temp }}/mit-scheme-stage2-x86-64/bin/mit-scheme" \
            --plugins edwin,imail,blowfish,gdbm,pgsql,x11 \
            --jobs "$(nproc)"

      - name: Verify W^X virtual memory mappings and SIGSEGV trap recovery
        run: |
          ./tests/ci/verify-wx-mappings.sh --scheme zig-out/bin/mit-scheme --library src/lib
          VERIFY_TMP=$(mktemp -d)
          trap 'rm -rf "${VERIFY_TMP}"' EXIT
          SCM_CI_TMPDIR="${VERIFY_TMP}" ./zig-out/bin/mit-scheme \
            --library src/lib \
            --band all.com \
            --emacs \
            --batch-mode \
            --no-init-file \
            --load tests/ci/verify-trap.scm \
            --eval '(%exit)' \
            </dev/null 2>&1 | tee "${VERIFY_TMP}/verify-trap.log"
          grep -q 'FORGE_TRAP_RECOVERY_OK' "${VERIFY_TMP}/verify-trap.log"

      - name: Run Scheme test suite and FFI plugin checks
        run: |
          python3 tests/ci/check-results.py \
            --src-dir src \
            --scheme-exe zig-out/bin/mit-scheme \
            --library-path src/lib
          (cd src/blowfish && MIT_SCHEME_EXE="${PWD}/../../zig-out/bin/mit-scheme" MITSCHEME_LIBRARY_PATH="${PWD}/../lib" sh ./blowfish-check.sh)
          (cd src/gdbm && MIT_SCHEME_EXE="${PWD}/../../zig-out/bin/mit-scheme" MITSCHEME_LIBRARY_PATH="${PWD}/../lib" sh ./gdbm-check.sh)
          ./zig-out/bin/mit-scheme \
            --library src/lib \
            --band all.com \
            --batch-mode \
            --no-init-file \
            --eval "(begin (load-option 'pgsql) (let ((s ((access escape-pgsql-string (->environment '(pgsql))) \"a'b\"))) (if (not (string=? s \"a''b\")) (error \"pgsql failed:\" s))) (display \"PGSQL_FFI_OK\n\") (load-option 'x11) (display \"X11_FFI_OK\n\") (%exit))" \
            </dev/null

  linux-x86-64-svm1:
    name: Linux x86-64 (SVM1 Bytecode VM)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install APT build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential mit-scheme libncurses-dev python3

      - name: Build SVM1 microcode variants and run unit & smoke tests
        run: |
          zig build -Darch=svm1_64le --release=fast
          zig build -Darch=svm1_64le -Dtermcap=emulate
          zig build test-unit -Darch=svm1_64le --summary all
          zig build test-smoke -Darch=svm1_64le --summary all

      - name: Restore Stage 2 SVM1 host cache
        id: stage2-cache
        if: ${{ inputs.force_full_bootstrap != true }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/mit-scheme-stage2-svm1
          key: >-
            linux-x86-64-svm1-stage2-${{
              hashFiles(
                'build.zig',
                'tools/build-scheme.py',
                'src/microcode/*.zig',
                'src/microcode/**/*.zig',
                'src/microcode/outf.c',
                'src/microcode/scm_setjmp.c',
                'src/compiler/**',
                'src/runtime/**',
                'src/sf/**',
                'src/cref/**',
                'src/sos/**'
              )
            }}

      - name: Build Stage 2 SVM1 host
        if: ${{ steps.stage2-cache.outputs.cache-hit != 'true' }}
        run: |
          ALL_COM=$(find /usr/lib /usr/local/lib -name all.com -path '*mit-scheme*' 2>/dev/null | head -n 1)
          if [ -z "${ALL_COM}" ]; then
            echo "error: could not find host mit-scheme all.com" >&2
            exit 1
          fi
          HOST_LIB=$(dirname "${ALL_COM}")
          STAGE2_PREFIX="${{ runner.temp }}/mit-scheme-stage2-svm1"
          python3 tools/build-scheme.py clean
          python3 tools/build-scheme.py build \
            --install \
            --arch svm1-64le \
            --optimize ReleaseFast \
            --cross \
            --host-scheme "$(command -v mit-scheme)" \
            --host-lib "${HOST_LIB}" \
            --prefix "${STAGE2_PREFIX}" \
            --jobs "$(nproc)"
          "${STAGE2_PREFIX}/bin/mit-scheme" --batch-mode --no-init-file --eval '(%exit)' </dev/null >/dev/null
          python3 tools/build-scheme.py clean

      - name: Save Stage 2 SVM1 host cache
        if: ${{ inputs.force_full_bootstrap != true && steps.stage2-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/mit-scheme-stage2-svm1
          key: ${{ steps.stage2-cache.outputs.cache-primary-key }}

      - name: Build Stage 3 self-hosted SVM1 and run Scheme test suite
        run: |
          python3 tools/build-scheme.py clean
          python3 tools/build-scheme.py build \
            --arch svm1-64le \
            --optimize ReleaseFast \
            --host-scheme "${{ runner.temp }}/mit-scheme-stage2-svm1/bin/mit-scheme" \
            --plugins edwin,imail \
            --jobs "$(nproc)"
          python3 tests/ci/check-results.py \
            --src-dir src \
            --scheme-exe zig-out/bin/mit-scheme \
            --library-path src/lib

  cross-compile:
    name: Zig Cross-Compilation Matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Cross-compile all non-Darwin microcode targets
        run: |
          zig build -Dtarget=x86_64-linux-gnu -Darch=x86_64 -Dtermcap=emulate --release=fast
          zig build -Dtarget=x86_64-linux-gnu -Darch=x86_64 -Dtermcap=none
          zig build -Dtarget=x86_64-linux-gnu -Darch=svm1_64le -Dtermcap=emulate --release=fast
          zig build -Dtarget=aarch64-linux-gnu -Darch=aarch64le -Dtermcap=emulate --release=fast
          zig build -Dtarget=aarch64-linux-gnu -Darch=svm1_64le -Dtermcap=emulate --release=fast
          zig build -Dtarget=x86_64-windows-gnu -Darch=x86_64 --release=fast
          zig build -Dtarget=x86_64-windows-gnu -Darch=x86_64 -Ddebugging=true
          zig build -Dtarget=x86_64-windows-gnu -Darch=svm1_64le --release=fast
          zig build -Dtarget=aarch64-windows-gnu -Darch=aarch64le --release=fast
          zig build -Dtarget=aarch64-windows-gnu -Darch=aarch64le -Ddebugging=true
          zig build -Dtarget=aarch64-windows-gnu -Darch=svm1_64le --release=fast
