name: AArch64 Native CI

on:
  push:
    branches:
      - master
      - apple-silicon
  pull_request:
    branches:
      - master
      - apple-silicon
  workflow_dispatch:
    inputs:
      force_full_bootstrap:
        description: Force clean full bootstrap (skip Stage 2 cache)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: aarch64-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos-arm64:
    name: macOS arm64 (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Homebrew build dependencies
        run: |
          brew install autoconf automake libtool texinfo mit-scheme
          TEXINFO_BIN="$(brew --prefix texinfo)/bin"
          echo "${TEXINFO_BIN}" >> "$GITHUB_PATH"
          "${TEXINFO_BIN}/makeinfo" --version | head -n 1

      - name: Restore Stage 2 native aarch64le host cache
        id: stage2-cache
        if: ${{ inputs.force_full_bootstrap != true }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mit-scheme-stage2-native
          key: >-
            macos-arm64-stage2-${{
              hashFiles(
                'src/microcode/*.h',
                'src/microcode/cmpintmd/aarch64*',
                'src/compiler/**',
                'src/runtime/**',
                'src/sf/**',
                'src/cref/**',
                'src/sos/**'
              )
            }}

      - name: Build Stage 2 native aarch64le host
        if: ${{ steps.stage2-cache.outputs.cache-hit != 'true' }}
        run: |
          ./tests/ci/bootstrap-and-test.sh \
            --stage2-only \
            --stage2-prefix "${{ runner.temp }}/mit-scheme-stage2-native"

      - name: Save Stage 2 native aarch64le host cache
        if: ${{ inputs.force_full_bootstrap != true && steps.stage2-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mit-scheme-stage2-native
          key: ${{ steps.stage2-cache.outputs.cache-primary-key }}

      - name: Build and verify native aarch64le (Stage 3)
        run: |
          ./tests/ci/bootstrap-and-test.sh \
            --native-host "${{ runner.temp }}/mit-scheme-stage2-native/bin/mit-scheme"
