name: Release macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional GitHub Release tag to publish to (e.g. v13.0.50-apple-silicon)
        type: string
        required: false
        default: ''
      version_string:
        description: Optional Scheme version override for bundle and DMG filename
        type: string
        required: false
        default: ''
      prerelease:
        description: Mark created GitHub Release as prerelease
        type: boolean
        required: false
        default: false
      force_full_bootstrap:
        description: Force clean full bootstrap (skip Stage 2 cache)
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-macos-dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release-dmg:
    name: Build & Release macOS arm64 DMG
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install Homebrew build dependencies
        run: |
          brew install mit-scheme

      - name: Restore Stage 2 native aarch64le host cache
        id: stage2-cache
        if: ${{ inputs.force_full_bootstrap != true }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/mit-scheme-stage2-native
          key: >-
            macos-arm64-stage2-${{
              hashFiles(
                'build.zig',
                'tools/build-scheme.py',
                'src/microcode/*.zig',
                'src/microcode/**/*.zig',
                'src/microcode/cmpauxmd/aarch64.S',
                'src/compiler/**',
                'src/runtime/**',
                'src/sf/**',
                'src/cref/**',
                'src/sos/**'
              )
            }}

      - name: Build Stage 2 native aarch64le host
        if: ${{ steps.stage2-cache.outputs.cache-hit != 'true' }}
        run: |
          ./tests/ci/bootstrap-and-test.sh \
            --stage2-only \
            --stage2-prefix "${{ runner.temp }}/mit-scheme-stage2-native"

      - name: Save Stage 2 native aarch64le host cache
        if: ${{ inputs.force_full_bootstrap != true && steps.stage2-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/mit-scheme-stage2-native
          key: ${{ steps.stage2-cache.outputs.cache-primary-key }}

      - name: Build and verify native aarch64le (Stage 3)
        run: |
          ./tests/ci/bootstrap-and-test.sh \
            --skip-macos-app \
            --native-host "${{ runner.temp }}/mit-scheme-stage2-native/bin/mit-scheme"

      - name: Build, package, and verify macOS DMG
        env:
          VERSION_ARG: ${{ inputs.version_string }}
        run: |
          ARGS=(--src-dir src --out-dir build-dmg --clean)
          if [ -n "${VERSION_ARG}" ]; then
            ARGS+=(--version "${VERSION_ARG}")
          fi
          ./tests/ci/build-macos-dmg.sh "${ARGS[@]}"

      - name: Upload DMG workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: mit-scheme-macos-arm64-dmg
          path: |
            build-dmg/*.dmg
            build-dmg/*.dmg.sha256

      - name: Publish DMG to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${RELEASE_TAG_INPUT}"
          fi
          shopt -s nullglob
          ASSETS=(build-dmg/*.dmg build-dmg/*.dmg.sha256)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "error: no DMG assets found in build-dmg/" >&2
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          else
            CREATE_ARGS=(
              "${TAG}"
              "${ASSETS[@]}"
              --title "MIT/GNU Scheme ${TAG} (Apple Silicon + SwiftUI Workbench)"
              --generate-notes
            )
            if [ "${IS_PRERELEASE}" = "true" ]; then
              CREATE_ARGS+=(--prerelease)
            fi
            gh release create "${CREATE_ARGS[@]}"
          fi
