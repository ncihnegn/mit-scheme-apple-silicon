name: macOS x86-64 CI

on:
  push:
    branches:
      - master
      - apple-silicon
      - zig
  pull_request:
    branches:
      - master
      - apple-silicon
      - zig
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-x86-64-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos-x86-64:
    uses: ./.github/workflows/_zig-microcode-ci.yml
    with:
      job_name: macOS x86-64 (Intel)
      runs_on: macos-15-intel
      arch: x86_64
      test_termcap_emulate: true
